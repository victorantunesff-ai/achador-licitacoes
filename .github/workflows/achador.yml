name: Achador de Licitações (diário)

on:
  schedule:
    # 11:00 UTC = 08:00 horário de Brasília (UTC-3, sem horário de verão)
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o achador
        run: python achador.py

      - name: Publicar resultado (commit automático)
        run: |
          git config user.name "achador-bot"
          git config user.email "achador-bot@users.noreply.github.com"
          git add docs/index.html oportunidades_abertas.csv
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
